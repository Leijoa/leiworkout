<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">死蟲式兩步動作示意圖</title>
  <desc id="desc">第一步仰躺，雙臂垂直，髖與膝各彎九十度。第二步慢慢將右手伸過頭、左腿向前伸直並接近地面，腰背維持貼地，再換邊。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d48c7"/></marker>
    <style>
      .panel{fill:#fff;stroke:#dcd8e9;stroke-width:2}.floor{stroke:#a9a4b8;stroke-width:3}.near{fill:none;stroke:#0f4c3a;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}.far{fill:none;stroke:#6d48c7;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}.joint{fill:#0f4c3a}.joint2{fill:#6d48c7}.arrow{fill:none;stroke:#6d48c7;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}.label{font:700 20px system-ui,"Noto Sans TC",sans-serif;fill:#25342f}.note{font:600 16px system-ui,"Noto Sans TC",sans-serif;fill:#5b5667}.small{font:600 14px system-ui,"Noto Sans TC",sans-serif;fill:#6d48c7}
    </style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#f7f5fb"/>
  <rect class="panel" x="22" y="48" width="368" height="286" rx="18"/>
  <rect class="panel" x="410" y="48" width="368" height="286" rx="18"/>
  <text class="label" x="44" y="79">步驟 1｜準備</text>
  <text class="note" x="44" y="105">腰背貼地，髖膝 90°，手臂朝上</text>
  <line class="floor" x1="48" y1="287" x2="364" y2="287"/>
  <circle cx="91" cy="256" r="22" fill="#0f4c3a"/>
  <path class="near" d="M113 266 L202 272"/>
  <path class="near" d="M157 268 L157 174"/>
  <path class="near" d="M202 271 L208 195 L278 195"/>
  <path class="far" d="M177 270 L180 190 L252 190"/>
  <circle class="joint" cx="157" cy="268" r="10"/><circle class="joint" cx="208" cy="195" r="10"/>
  <circle class="joint2" cx="180" cy="190" r="8"/>
  <text class="small" x="145" y="144">手腕在肩上方</text>
  <text class="small" x="240" y="219">小腿平行地面</text>

  <text class="label" x="432" y="79">步驟 2｜對側伸展</text>
  <text class="note" x="432" y="105">右手過頭＋左腿伸直，再換邊</text>
  <line class="floor" x1="436" y1="287" x2="752" y2="287"/>
  <circle cx="489" cy="256" r="22" fill="#0f4c3a"/>
  <path class="near" d="M511 266 L599 272"/>
  <path class="near" d="M555 268 L469 279"/>
  <path class="near" d="M599 271 L653 247 L726 279"/>
  <path class="far" d="M575 269 L575 188"/>
  <path class="far" d="M599 268 L606 196 L673 196"/>
  <circle class="joint" cx="555" cy="268" r="10"/><circle class="joint" cx="653" cy="247" r="10"/>
  <circle class="joint2" cx="575" cy="269" r="8"/><circle class="joint2" cx="606" cy="196" r="8"/>
  <path class="arrow" d="M539 207 Q500 219 474 264"/>
  <path class="arrow" d="M651 218 Q697 228 721 264"/>
  <text class="small" x="438" y="322">慢慢接近地面，不碰地</text>
  <text class="small" x="607" y="322">肋骨收緊・腰不拱起</text>
</svg>
