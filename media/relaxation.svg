<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">慢走與胸肩放鬆示意圖</title><desc id="desc">先用輕鬆步伐慢走，雙臂自然放鬆擺動。再站直，雙手在身後輕握並稍微向下延伸，舒展胸肩但不強拉。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d48c7"/></marker><style>.p{fill:#fff;stroke:#dcd8e9;stroke-width:2}.f{stroke:#aaa5b8;stroke-width:3}.b{fill:none;stroke:#0f4c3a;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.v{fill:none;stroke:#6d48c7;stroke-width:14;stroke-linecap:round}.a{fill:none;stroke:#6d48c7;stroke-width:4;marker-end:url(#a)}.h{font:700 20px system-ui,"Noto Sans TC";fill:#25342f}.n{font:600 16px system-ui,"Noto Sans TC";fill:#5b5667}.s{font:600 14px system-ui,"Noto Sans TC";fill:#6d48c7}</style></defs>
  <rect width="800" height="360" rx="24" fill="#f7f5fb"/><rect class="p" x="22" y="48" width="368" height="286" rx="18"/><rect class="p" x="410" y="48" width="368" height="286" rx="18"/>
  <text class="h" x="44" y="79">動作 1｜輕鬆慢走</text><text class="n" x="44" y="105">縮小步伐，雙臂自然放鬆擺動</text><line class="f" x1="48" y1="294" x2="364" y2="294"/>
  <circle cx="202" cy="139" r="23" fill="#0f4c3a"/><path class="b" d="M202 166 L202 225 M199 184 L158 222 M205 184 L247 214 M202 224 L164 286 M202 224 L253 273"/><path class="a" d="M147 200 Q137 223 153 242"/><text class="s" x="68" y="320">呼吸放慢，走到心跳平穩</text>
  <text class="h" x="432" y="79">動作 2｜輕展胸肩</text><text class="n" x="432" y="105">雙手在身後輕握，手臂稍向下</text><line class="f" x1="436" y1="294" x2="752" y2="294"/>
  <circle cx="594" cy="139" r="23" fill="#0f4c3a"/><path class="b" d="M594 166 L594 231 M594 230 L567 287 M594 230 L621 287"/><path class="v" d="M572 184 Q552 218 574 249 M616 184 Q636 218 614 249 M574 249 L614 249"/><path class="a" d="M594 203 V238"/><text class="s" x="454" y="320">肩膀放下，不後仰、不強拉</text>
</svg>
