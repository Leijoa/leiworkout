<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">低眼鏡蛇式兩步示意圖</title><desc id="desc">趴在地面，雙手放在胸口兩側、手肘向後彎。使用背部肌肉輕輕抬起頭與胸口，骨盆和腿留在地面，手臂仍彎曲，不用手硬推到高處。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d48c7"/></marker><style>.p{fill:#fff;stroke:#dcd8e9;stroke-width:2}.f{stroke:#aaa5b8;stroke-width:3}.b{fill:none;stroke:#0f4c3a;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}.v{fill:none;stroke:#6d48c7;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#6d48c7;stroke-width:4;marker-end:url(#a)}.h{font:700 20px system-ui,"Noto Sans TC";fill:#25342f}.n{font:600 16px system-ui,"Noto Sans TC";fill:#5b5667}.s{font:600 14px system-ui,"Noto Sans TC";fill:#6d48c7}</style></defs>
  <rect width="800" height="360" rx="24" fill="#f7f5fb"/><rect class="p" x="22" y="48" width="368" height="286" rx="18"/><rect class="p" x="410" y="48" width="368" height="286" rx="18"/>
  <text class="h" x="44" y="79">步驟 1｜俯臥準備（側視）</text><text class="n" x="44" y="105">雙手在胸口兩側，手肘向後彎</text><line class="f" x1="48" y1="287" x2="364" y2="287"/>
  <circle cx="97" cy="249" r="22" fill="#0f4c3a"/><path class="b" d="M119 264 Q190 271 244 274 L332 280"/><path class="v" d="M153 266 L177 235 L205 276"/><text class="s" x="66" y="320">雙腿放鬆延伸・肩膀遠離耳朵</text>
  <text class="h" x="432" y="79">步驟 2｜輕抬胸口</text><text class="n" x="432" y="105">背部出力，骨盆與腿留在地面</text><line class="f" x1="436" y1="287" x2="752" y2="287"/>
  <circle cx="492" cy="202" r="22" fill="#0f4c3a"/><path class="b" d="M511 218 Q553 262 618 273 L724 280"/><path class="v" d="M548 257 L566 228 L594 276"/><path class="a" d="M475 251 Q459 225 479 209"/><text class="s" x="441" y="320">手肘保持彎曲・不靠手硬推高</text>
</svg>
