<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">腳踝與肩膀活動示意圖</title><desc id="desc">第一格坐著或扶穩支撐物，抬起一腳慢慢繞腳踝。第二格站直，雙肩同時向後畫圓。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d48c7"/></marker><style>.p{fill:#fff;stroke:#dcd8e9;stroke-width:2}.f{stroke:#aaa5b8;stroke-width:3}.b{fill:none;stroke:#0f4c3a;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.x{fill:none;stroke:#0f4c3a;stroke-width:8;stroke-linecap:round}.a{fill:none;stroke:#6d48c7;stroke-width:4;marker-end:url(#a)}.h{font:700 20px system-ui,"Noto Sans TC";fill:#25342f}.n{font:600 16px system-ui,"Noto Sans TC";fill:#5b5667}.s{font:600 14px system-ui,"Noto Sans TC";fill:#6d48c7}</style></defs>
  <rect width="800" height="360" rx="24" fill="#f7f5fb"/><rect class="p" x="22" y="48" width="368" height="286" rx="18"/><rect class="p" x="410" y="48" width="368" height="286" rx="18"/>
  <text class="h" x="44" y="79">動作 1｜腳踝畫圓</text><text class="n" x="44" y="105">坐著或扶穩，單腳離地慢慢繞</text><line class="f" x1="48" y1="294" x2="364" y2="294"/>
  <path class="x" d="M102 190 H222 V260 H112 M120 190 V287"/><circle cx="196" cy="139" r="22" fill="#0f4c3a"/><path class="b" d="M196 164 L195 218 L235 254 L290 254 M195 218 L166 267 L142 287"/><path class="a" d="M277 226 Q319 239 296 275 Q269 295 248 263"/><text class="s" x="60" y="320">膝蓋保持安定，換腳重複</text>
  <text class="h" x="432" y="79">動作 2｜肩膀向後繞</text><text class="n" x="432" y="105">站直，雙肩往上、後、下畫圓</text><line class="f" x1="436" y1="294" x2="752" y2="294"/>
  <circle cx="594" cy="139" r="23" fill="#0f4c3a"/><path class="b" d="M594 166 L594 232 M591 183 L548 239 M597 183 L640 239 M594 231 L563 287 M594 231 L625 287"/><path class="a" d="M560 207 Q530 174 559 157"/><path class="a" d="M628 207 Q658 174 629 157"/><text class="s" x="466" y="320">動作小而順，不聳肩用力</text>
</svg>
