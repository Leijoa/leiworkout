<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">高腳杯深蹲兩步示意圖</title><desc id="desc">雙腳約肩寬站立，雙手把一個啞鈴穩定抱在胸前。臀部向後下方坐，膝蓋順著腳尖方向彎曲、腳跟留在地面，再站回起始姿勢。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d48c7"/></marker><style>.p{fill:#fff;stroke:#dcd8e9;stroke-width:2}.f{stroke:#aaa5b8;stroke-width:3}.b{fill:none;stroke:#0f4c3a;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.db{fill:#6d48c7;stroke:#4f3299;stroke-width:3}.a{fill:none;stroke:#6d48c7;stroke-width:4;marker-end:url(#a)}.h{font:700 20px system-ui,"Noto Sans TC";fill:#25342f}.n{font:600 16px system-ui,"Noto Sans TC";fill:#5b5667}.s{font:600 14px system-ui,"Noto Sans TC";fill:#6d48c7}</style></defs>
  <rect width="800" height="360" rx="24" fill="#f7f5fb"/><rect class="p" x="22" y="48" width="368" height="286" rx="18"/><rect class="p" x="410" y="48" width="368" height="286" rx="18"/>
  <text class="h" x="44" y="79">步驟 1｜胸前穩定持鈴</text><text class="n" x="44" y="105">雙腳約肩寬，腳掌完整踩地</text><line class="f" x1="48" y1="294" x2="364" y2="294"/>
  <circle cx="204" cy="137" r="22" fill="#0f4c3a"/><path class="b" d="M204 163 L204 226 M201 181 L174 204 L194 211 M207 181 L234 204 L214 211 M204 225 L169 287 M204 225 L239 287"/><g class="db"><rect x="181" y="200" width="46" height="15" rx="7"/><rect x="185" y="192" width="11" height="31" rx="3"/><rect x="212" y="192" width="11" height="31" rx="3"/></g><text class="s" x="75" y="320">胸口抬起・腳跟不墊高</text>
  <text class="h" x="432" y="79">步驟 2｜臀部向後下坐</text><text class="n" x="432" y="105">膝蓋對準腳尖，下降到舒服深度</text><line class="f" x1="436" y1="294" x2="752" y2="294"/>
  <circle cx="579" cy="166" r="22" fill="#0f4c3a"/><path class="b" d="M579 191 L604 237 M585 205 L557 226 L584 226 M592 209 L620 224 L599 232 M604 237 L558 246 L531 286 M604 237 L656 248 L682 286"/><g class="db"><rect x="570" y="220" width="46" height="15" rx="7"/><rect x="574" y="212" width="11" height="31" rx="3"/><rect x="601" y="212" width="11" height="31" rx="3"/></g><path class="a" d="M630 190 Q654 215 644 238"/><text class="s" x="445" y="320">重量留在全腳掌，再推地站起</text>
</svg>
