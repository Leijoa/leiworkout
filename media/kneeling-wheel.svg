<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">跪姿健腹輪兩步示意圖</title><desc id="desc">跪在軟墊上，雙手握住健腹輪，核心收緊。慢慢將輪子向前推出一小段，身體維持一直線、腰部不下塌，再用腹部控制返回。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d48c7"/></marker><style>.p{fill:#fff;stroke:#dcd8e9;stroke-width:2}.f{stroke:#aaa5b8;stroke-width:3}.b{fill:none;stroke:#0f4c3a;stroke-width:19;stroke-linecap:round;stroke-linejoin:round}.v{fill:none;stroke:#6d48c7;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.w{fill:#fff;stroke:#6d48c7;stroke-width:8}.a{fill:none;stroke:#6d48c7;stroke-width:4;marker-end:url(#a)}.h{font:700 20px system-ui,"Noto Sans TC";fill:#25342f}.n{font:600 16px system-ui,"Noto Sans TC";fill:#5b5667}.s{font:600 14px system-ui,"Noto Sans TC";fill:#6d48c7}</style></defs>
  <rect width="800" height="360" rx="24" fill="#f7f5fb"/><rect class="p" x="22" y="48" width="368" height="286" rx="18"/><rect class="p" x="410" y="48" width="368" height="286" rx="18"/>
  <text class="h" x="44" y="79">步驟 1｜跪姿準備</text><text class="n" x="44" y="105">膝下墊軟墊，握輪、收緊核心</text><line class="f" x1="48" y1="294" x2="364" y2="294"/><rect x="77" y="281" width="162" height="13" rx="6" fill="#d9d3ec"/>
  <circle cx="181" cy="153" r="22" fill="#0f4c3a"/><path class="b" d="M192 174 L235 221 L207 263 L137 283 M230 217 L287 258"/><path class="v" d="M220 205 L272 256"/><circle class="w" cx="292" cy="274" r="20"/><line x1="276" y1="274" x2="308" y2="274" stroke="#0f4c3a" stroke-width="7" stroke-linecap="round"/><text class="s" x="61" y="320">臀部微收・腰背維持平直</text>
  <text class="h" x="432" y="79">步驟 2｜短幅度推出</text><text class="n" x="432" y="105">輪子慢慢向前，身體一起延伸</text><line class="f" x1="436" y1="294" x2="752" y2="294"/><rect x="450" y="281" width="160" height="13" rx="6" fill="#d9d3ec"/>
  <circle cx="552" cy="180" r="22" fill="#0f4c3a"/><path class="b" d="M567 197 L626 238 L589 270 L512 284 M622 235 L704 259"/><path class="v" d="M609 226 L690 257"/><circle class="w" cx="711" cy="274" r="20"/><line x1="695" y1="274" x2="727" y2="274" stroke="#0f4c3a" stroke-width="7" stroke-linecap="round"/><path class="a" d="M650 289 H694"/><text class="s" x="438" y="320">只推到腰不塌的位置，再控制返回</text>
</svg>
