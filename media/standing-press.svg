<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">站姿啞鈴肩推兩步示意圖</title><desc id="desc">雙腳穩定站立，兩個啞鈴放在肩膀兩側。收緊腹部，將啞鈴垂直推到頭頂上方，軀幹保持直立、不向後仰，再慢慢降回肩旁。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d48c7"/></marker><style>.p{fill:#fff;stroke:#dcd8e9;stroke-width:2}.f{stroke:#aaa5b8;stroke-width:3}.b{fill:none;stroke:#0f4c3a;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.v{fill:none;stroke:#6d48c7;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.db{fill:#6d48c7;stroke:#4f3299;stroke-width:3}.a{fill:none;stroke:#6d48c7;stroke-width:4;marker-end:url(#a)}.h{font:700 20px system-ui,"Noto Sans TC";fill:#25342f}.n{font:600 16px system-ui,"Noto Sans TC";fill:#5b5667}.s{font:600 14px system-ui,"Noto Sans TC";fill:#6d48c7}</style></defs>
  <rect width="800" height="360" rx="24" fill="#f7f5fb"/><rect class="p" x="22" y="48" width="368" height="286" rx="18"/><rect class="p" x="410" y="48" width="368" height="286" rx="18"/>
  <text class="h" x="44" y="79">步驟 1｜啞鈴在肩旁</text><text class="n" x="44" y="105">雙腳踩穩，腹部收緊、身體直立</text><line class="f" x1="48" y1="294" x2="364" y2="294"/>
  <circle cx="204" cy="145" r="22" fill="#0f4c3a"/><path class="b" d="M204 170 L204 229 M202 187 L164 213 L145 187 M206 187 L244 213 L263 187 M204 228 L174 287 M204 228 L234 287"/>
  <g class="db"><rect x="126" y="174" width="38" height="14" rx="6"/><rect x="132" y="166" width="10" height="30" rx="3"/><rect x="148" y="166" width="10" height="30" rx="3"/><rect x="244" y="174" width="38" height="14" rx="6"/><rect x="250" y="166" width="10" height="30" rx="3"/><rect x="266" y="166" width="10" height="30" rx="3"/></g><text class="s" x="91" y="320">手腕在手肘上方・肋骨收好</text>
  <text class="h" x="432" y="79">步驟 2｜垂直推過頭</text><text class="n" x="432" y="105">手臂向上伸展，軀幹保持不動</text><line class="f" x1="436" y1="294" x2="752" y2="294"/>
  <circle cx="594" cy="165" r="22" fill="#0f4c3a"/><path class="b" d="M594 190 L594 237 M592 201 L554 166 L554 126 M596 201 L634 166 L634 126 M594 236 L564 287 M594 236 L624 287"/>
  <g class="db"><rect x="535" y="106" width="38" height="14" rx="6"/><rect x="541" y="98" width="10" height="30" rx="3"/><rect x="557" y="98" width="10" height="30" rx="3"/><rect x="615" y="106" width="38" height="14" rx="6"/><rect x="621" y="98" width="10" height="30" rx="3"/><rect x="637" y="98" width="10" height="30" rx="3"/></g><path class="a" d="M529 168 V132"/><path class="a" d="M659 168 V132"/><text class="s" x="474" y="320">不聳肩、不後仰，再慢慢下降</text>
</svg>
